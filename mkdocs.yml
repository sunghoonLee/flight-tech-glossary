site_name: Flight Tech Glossary
site_description: 항공 기술 용어 사전
site_url: https://sunghoonLee.github.io/flight-tech-glossary/
repo_url: https://github.com/sunghoonLee/flight-tech-glossary
repo_name: sunghoonLee/flight-tech-glossary

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list

nav:
  - Home: index.md
  - 공통:
    - GDS 용어집: gds-terminology.md
    - BSP 정산 가이드: bsp-settlement-guide.md
  - Amadeus:
    - WBS Integration Flow: amadeus-wbs-integration-flow.md
    - 검색:
      - Fare_MasterPricerCalendar: fare-master-pricer-calendar.md
      - Fare_MasterPricerTravelBoardSearch: master-pricer-travelboard-search.md
    - 가격 조회 및 규정 확인:
      - Fare_InformativeBestPricingWithoutPNR: fare-informative-best-pricing.md
      - Fare_InformativePricingWithoutPNR: fare-informative-pricing.md
      - Fare_CheckRules: fare-check-rules.md
      - Fare_GetFareRules: fare-get-fare-rules.md
      - MiniRule_GetFromRec: minirule-get-from-rec.md
    - 예약 생성:
      - Air_SellFromRecommendation: air-sell-from-recommendation.md
      - PNR_AddMultiElements: pnr-add-multi-elements.md
      - FOP_CreateFormOfPayment: fop-create-form-of-payment.md
    - 발권:
      - Fare_PricePNRWithBookingClass: fare-price-pnr-with-booking-class.md
      - PNR_Retrieve: pnr-retrieve.md
    - 후속 처리:
      - SalesReports: sales-reports.md
      - Cancellation Flow: cancellation-flow.md
    - 기타:
      - Air FlightInfo: air-flightinfo.md
  - 용어 색인: glossary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sunghoonLee/flight-tech-glossary
